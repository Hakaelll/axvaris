name: Packages (manual, zero-cost aware)

# Packaging is never automatic so it cannot consume hosted-runner quota by surprise.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-repository.mjs
      - run: node scripts/audit-licenses.mjs
      - run: pnpm tauri build --bundles nsis
      - name: Normalize public package name
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) target/release/bundle/nsis/Axvaris-Setup.exe
          Copy-Item target/release/Axvaris.exe target/release/bundle/nsis/Axvaris.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Axvaris-Windows-x64
          path: |
            target/release/bundle/nsis/Axvaris-Setup.exe
            target/release/bundle/nsis/Axvaris.exe
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install free Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-repository.mjs
      - run: node scripts/audit-licenses.mjs
      - run: pnpm tauri build --bundles appimage,deb
      - name: Normalize public package names
        run: |
          cp "$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)" target/release/bundle/appimage/Axvaris.AppImage
          cp "$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n 1)" target/release/bundle/deb/Axvaris.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Axvaris-Linux-x64
          path: |
            target/release/bundle/appimage/Axvaris.AppImage
            target/release/bundle/deb/Axvaris.deb
          if-no-files-found: error
          retention-days: 1
