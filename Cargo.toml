[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/sabicheiro-core",
  "crates/sabicheiro-capture",
  "crates/sabicheiro-geo",
  "crates/sabicheiro-storage",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
