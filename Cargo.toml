[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/sabicheiro-core",
  "crates/sabicheiro-capture",
  "crates/sabicheiro-geo",
  "crates/sabicheiro-storage",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
