[package]
name = "sabicheiro-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["linux-ebpf"]
linux-ebpf = ["dep:aya"]

[dependencies]
sabicheiro-core = { path = "../sabicheiro-core" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", optional = true }

[[bin]]
name = "axvaris-capture-helper"
path = "src/bin/axvaris-capture-helper.rs"
required-features = ["linux-ebpf"]

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
